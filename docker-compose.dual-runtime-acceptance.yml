services:
  postgres:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  minio:
    ports: !reset []

  api-server:
    ports: !reset []
    environment:
      APP_ENV: testing
      SEED_LOCAL_CONFIG: "false"

  agent-worker:
    environment:
      APP_ENV: testing
      AGENT_RUNTIME_ACCEPTANCE_AFTER_RESULT_PAUSE_SECONDS: ${AGENT_RUNTIME_ACCEPTANCE_AFTER_RESULT_PAUSE_SECONDS:-0}
      PYTHON_AGENT_RUNTIME_URL: ${DUAL_RUNTIME_ACCEPTANCE_PYTHON_RUNTIME_URL:-http://python-runtime-fault-proxy:8180}
      PYTHON_AGENT_RUNTIME_ALLOWED_HOSTS: ${DUAL_RUNTIME_ACCEPTANCE_PYTHON_RUNTIME_HOST:-python-runtime-fault-proxy}
      TYPESCRIPT_AGENT_RUNTIME_URL: ${DUAL_RUNTIME_ACCEPTANCE_TYPESCRIPT_RUNTIME_URL:-http://typescript-runtime-fault-proxy:8180}
      TYPESCRIPT_AGENT_RUNTIME_ALLOWED_HOSTS: ${DUAL_RUNTIME_ACCEPTANCE_TYPESCRIPT_RUNTIME_HOST:-typescript-runtime-fault-proxy}
    depends_on:
      python-runtime-fault-proxy:
        condition: service_healthy
      typescript-runtime-fault-proxy:
        condition: service_healthy

  python-agent-runtime:
    environment:
      APP_ENV: testing
      AGENT_RUNTIME_TEST_PROVIDER_MODE: ${AGENT_RUNTIME_TEST_PROVIDER_MODE:-deterministic}

  typescript-agent-runtime:
    environment:
      APP_ENV: testing
      AGENT_RUNTIME_TEST_PROVIDER_MODE: ${AGENT_RUNTIME_TEST_PROVIDER_MODE:-deterministic}

  python-runtime-fault-proxy:
    profiles: ["dual-runtime-acceptance"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api-server
    command:
      ["python", "-m", "uvicorn", "app.acceptance.runtime_fault_proxy:create_app", "--factory", "--host", "0.0.0.0", "--port", "8180"]
    restart: "no"
    environment:
      RUNTIME_FAULT_PROXY_UPSTREAM: http://python-agent-runtime:8091
    expose:
      - "8180"
    depends_on:
      python-agent-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8180/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - agent-runtime-control

  typescript-runtime-fault-proxy:
    profiles: ["dual-runtime-acceptance"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api-server
    command:
      ["python", "-m", "uvicorn", "app.acceptance.runtime_fault_proxy:create_app", "--factory", "--host", "0.0.0.0", "--port", "8180"]
    restart: "no"
    environment:
      RUNTIME_FAULT_PROXY_UPSTREAM: http://typescript-agent-runtime:8090
    expose:
      - "8180"
    depends_on:
      typescript-agent-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8180/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - agent-runtime-control

  admin-web:
    ports: !reset []

  dual-runtime-compose-acceptance:
    profiles: ["dual-runtime-acceptance"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api-server
    command: ["python", "-m", "app.acceptance.dual_runtime_composition"]
    restart: "no"
    environment:
      DATABASE_DSN: postgresql://enterprise_agent:enterprise_agent@postgres:5432/enterprise_agent
      RABBITMQ_URL: amqp://enterprise_agent:enterprise_agent@rabbitmq:5672/
      APP_CONFIG_MASTER_KEY_FILE: /run/secrets/app_config_master_key
      PYTHON_AGENT_RUNTIME_URL: http://python-agent-runtime:8091
      PYTHON_AGENT_RUNTIME_ALLOWED_HOSTS: python-agent-runtime
      TYPESCRIPT_AGENT_RUNTIME_URL: http://typescript-agent-runtime:8090
      TYPESCRIPT_AGENT_RUNTIME_ALLOWED_HOSTS: typescript-agent-runtime
      AGENT_RUNTIME_ALLOW_INSECURE_INTERNAL_HTTP: "true"
      MODEL_PROVIDER_HOST_ALLOWLIST: api.deepseek.com
      APP_ENV: testing
      SEED_LOCAL_CONFIG: "false"
      FEATURE_PUBLISHED_AGENT_RUNTIME: "true"
      AGENT_RUNTIME_TEST_PROVIDER_MODE: ${AGENT_RUNTIME_TEST_PROVIDER_MODE:-deterministic}
      AGENT_MAX_RETRY_COUNT: "1"
      AGENT_RETRY_DELAY_SECONDS: "1"
      DUAL_RUNTIME_ACCEPTANCE_API_KEY: ${DUAL_RUNTIME_ACCEPTANCE_API_KEY:-}
      DUAL_RUNTIME_ACCEPTANCE_ACTION: ${DUAL_RUNTIME_ACCEPTANCE_ACTION:-full}
      DUAL_RUNTIME_ACCEPTANCE_RUNTIME_KIND: ${DUAL_RUNTIME_ACCEPTANCE_RUNTIME_KIND:-}
      DUAL_RUNTIME_ACCEPTANCE_PHASE: ${DUAL_RUNTIME_ACCEPTANCE_PHASE:-}
      DUAL_RUNTIME_ACCEPTANCE_JOB_ID: ${DUAL_RUNTIME_ACCEPTANCE_JOB_ID:-}
      DUAL_RUNTIME_ACCEPTANCE_EXPECTED_STATUS: ${DUAL_RUNTIME_ACCEPTANCE_EXPECTED_STATUS:-}
      ONES_MOCK_ACCEPTANCE_CONFIG: /run/acceptance/ones-mock.yaml
    volumes:
      - ./ones_mock/mock.yaml:/run/acceptance/ones-mock.yaml:ro
    secrets:
      - app_config_master_key
    depends_on:
      api-server:
        condition: service_healthy
      agent-worker:
        condition: service_started
      job-dispatch-worker:
        condition: service_healthy
      delivery-dispatch-worker:
        condition: service_healthy
    networks:
      - default
      - agent-runtime-control

volumes:
  postgres18-data:
    name: enterprise_agent_dual_runtime_acceptance_postgres18_data
  rabbitmq4-data:
    name: enterprise_agent_dual_runtime_acceptance_rabbitmq4_data
  minio-data:
    name: enterprise_agent_dual_runtime_acceptance_minio_data
