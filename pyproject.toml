[project]
name = "enterprise-agent"
version = "0.1.0"
description = "Read-only enterprise diagnostic agent MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pika>=1.3",
  "PyJWT[crypto]>=2.10.1,<3.0.0",
  "cryptography>=42.0",
  "jsonschema>=4.23,<5.0",
  "dingtalk-stream>=0.24.3",
  "pyyaml>=6.0",
  "sqlglot>=25",
  "boto3>=1.35",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "Pillow>=10.4",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]
# Database drivers used directly by tool-mcp's bounded read-only resource adapters.
# Optional so API and Worker images stay slim; install only in the tool-mcp image.
database = [
  "pymysql>=1.1",
  "pymssql>=2.3",
  "oracledb>=2.2",
  "redis>=5.0",
]
python-runtime = [
  "claude-agent-sdk==0.2.134",
]
# Governed MCP servers use the stateless MCP v2 HTTP transport in isolated images.
# Agent runtimes remain protocol clients and do not install either server dependency.
tool-mcp = [
  "mcp==2.0.0",
]
ones-mcp = [
  "mcp==2.0.0",
]
file-service = [
  "mcp==2.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "integration: opt-in tests that require external runtimes or credentials",
]
