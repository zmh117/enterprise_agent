# Opt in to managed browsing/checkout/update/history inside knowledge-sync.
# Registry and auth paths use CODE_SVN_LOCAL_STATE_ROOT from the main Compose file.
# This enables no scheduled collection or model extraction.
services:
  api-server:
    environment:
      CODE_CHECKOUT_ENABLED: "true"
  knowledge-sync:
    environment:
      CODE_CHECKOUT_ENABLED: "true"
