[project]
name = "enterprise-data-mcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.0.0",
  "psycopg[binary,pool]==3.3.4",
  "PyJWT[crypto]==2.13.0",
  "cryptography==50.0.0",
  "PyYAML==6.0.3",
  "sqlglot==30.15.0",
  "PyMySQL==1.2.0",
  "pymssql==2.3.13",
  "oracledb==4.0.2",
  "redis==8.1.0",
]

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"
