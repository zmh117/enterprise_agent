# Isolated local trial. Attach only the authenticated platform API to ingress.
services:
  evidence-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${BROWSER_EVIDENCE_S3_ACCESS_ID:?set dedicated trial identity}
      MINIO_ROOT_PASSWORD: ${BROWSER_EVIDENCE_S3_ACCESS_SECRET:?set dedicated trial secret}
    networks: [objects]
    volumes: [evidence-objects:/data]
  evidence-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [evidence-minio]
    environment:
      AWS_ACCESS_KEY_ID: ${BROWSER_EVIDENCE_S3_ACCESS_ID:?}
      AWS_SECRET_ACCESS_KEY: ${BROWSER_EVIDENCE_S3_ACCESS_SECRET:?}
    entrypoint: [sh, -ec]
    command:
      - |
        until mc alias set trial http://evidence-minio:9000 "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing trial/browser-evidence
    networks: [objects]
  evidence-loki:
    image: grafana/loki:3.5.2
    command: [-config.file=/etc/loki/evidence.yaml]
    depends_on:
      evidence-bucket: {condition: service_completed_successfully}
    environment:
      AWS_ACCESS_KEY_ID: ${BROWSER_EVIDENCE_S3_ACCESS_ID:?}
      AWS_SECRET_ACCESS_KEY: ${BROWSER_EVIDENCE_S3_ACCESS_SECRET:?}
    volumes:
      - ${BROWSER_EVIDENCE_LOKI_TLS_DIR:?set dedicated Loki certificate directory}:/run/evidence-tls:ro
      - ./loki.yaml:/etc/loki/evidence.yaml:ro
      - evidence-index:/loki
    networks: [ingress, objects]
  evidence-alloy:
    image: grafana/alloy@sha256:41c41849989b7e054ccbadc17938ee1e5592fe26bfbc56ef3ffc109c0b0b2739
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/evidence.alloy]
    depends_on: [evidence-loki]
    volumes:
      - ${BROWSER_EVIDENCE_ALLOY_TLS_DIR:?set dedicated Alloy certificate directory}:/run/evidence-tls:ro
      - ./evidence.alloy:/etc/alloy/evidence.alloy:ro
      - evidence-alloy-data:/var/lib/alloy/data
    networks: [ingress]
networks:
  ingress: {internal: true}
  objects: {internal: true}
volumes:
  evidence-objects:
  evidence-index:
  evidence-alloy-data:
