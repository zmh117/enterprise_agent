{
  buckets(groupBy: $groupBy, orderBy: $groupOrderBy, pagination: $pagination, filter: $groupFilter) {
    tasks(filterGroup: $filterGroup, orderBy: $orderBy, limit: 51, includeAncestors: {pathField: "path"}, orderByPath: "path") {
      number
      name
      issueType { uuid }
    }
    pageInfo { count totalCount endCursor hasNextPage preciseCount }
  }
}
