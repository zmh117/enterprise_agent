{
  buckets(groupBy: $groupBy, orderBy: $orderBy, pagination: $pagination) {
    projects(orderBy: $projectOrderBy, filterGroup: $projectFilterGroup) {
      uuid
      name
      status { uuid name category }
      isSample
      isArchive
      owner { uuid name }
    }
    pageInfo { count totalCount endCursor hasNextPage unstable }
  }
}
