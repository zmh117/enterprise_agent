query TESTCASE_PLAN_CASE_LIST_UUIDS($testCaseFilter: Filter, $planFilter: Filter, $moduleFilter: Filter, $orderByFilter: Filter) {
  buckets(groupBy: {testcasePlanCases: {}}, pagination: $pagination) {
    testcasePlanCases(filterGroup: $testCaseFilter, orderBy: $orderByFilter) {
      testcaseCase { uuid }
    }
    pageInfo { count totalCount endCursor hasNextPage unstable }
  }
}
