ServerRoot /etc/apache2
ServerName code-svn
Listen 8443
PidFile /tmp/code-svn-httpd.pid
DefaultRuntimeDir /tmp
IncludeOptional /etc/apache2/mods-enabled/*.load
TypesConfig /etc/mime.types
User code-svn
Group code-svn
ErrorLog /proc/self/fd/2
LogLevel warn
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8443>
    SSLEngine on
    SSLCertificateFile /state/tls/server.crt
    SSLCertificateKeyFile /state/tls/server.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    <Location /repos/mes>
        DAV svn
        SVNPath /state/repos/mes
        <Limit GET PROPFIND OPTIONS REPORT>
            Require all granted
        </Limit>
        <LimitExcept GET PROPFIND OPTIONS REPORT>
            Require all denied
        </LimitExcept>
    </Location>
</VirtualHost>
