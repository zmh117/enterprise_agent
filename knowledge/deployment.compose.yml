# 独立知识项目；由受限控制器管理，不加载根 Compose。
# --project-directory 必须指向已安装的可信发布目录。
services:
  knowledge-embedding:
    image: enterprise-agent/knowledge-embedding:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    build:
      context: .
      dockerfile: services/knowledge_embedding/Dockerfile
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
    - knowledge-models:/models:ro
    networks:
    - knowledge-internal
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 4
    mem_limit: 8g
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/ready',timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
    restart: unless-stopped
  knowledge-model-prepare:
    image: enterprise-agent/knowledge-embedding:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    build:
      context: .
      dockerfile: services/knowledge_embedding/Dockerfile
    command:
    - python
    - -m
    - services.knowledge_embedding.model_files
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    volumes:
    - knowledge-models:/models
    networks:
    - egress
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    restart: 'no'
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
    profiles:
    - maintenance
  knowledge-reranker-prepare:
    image: enterprise-agent/knowledge-reranker:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    build:
      context: .
      dockerfile: services/knowledge_reranker/Dockerfile
    command:
    - python
    - -m
    - services.knowledge_reranker.model_files
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    volumes:
    - knowledge-reranker-models:/models
    networks:
    - egress
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    restart: 'no'
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
    profiles:
    - maintenance
  knowledge-qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    ports:
    - ${KNOWLEDGE_QDRANT_BIND:-127.0.0.1}:6333:6333
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
      QDRANT__LOG_LEVEL: ERROR
    volumes:
    - knowledge-qdrant:/qdrant/storage
    networks:
    - knowledge-internal
    - egress
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
    restart: unless-stopped
  knowledge-embedding-online:
    image: enterprise-agent/knowledge-embedding:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    build:
      context: .
      dockerfile: services/knowledge_embedding/Dockerfile
    command:
    - uvicorn
    - services.knowledge_embedding.api:create_online_app
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '8096'
    - --no-access-log
    - --log-level
    - critical
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
    - knowledge-models:/models:ro
    networks:
    - knowledge-internal
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 6g
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/ready',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
  knowledge-reranker:
    image: enterprise-agent/knowledge-reranker:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    build:
      context: .
      dockerfile: services/knowledge_reranker/Dockerfile
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '8'
      MKL_NUM_THREADS: '8'
    volumes:
    - knowledge-reranker-models:/models:ro
    networks:
    - knowledge-internal
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 8
    mem_limit: 3g
    memswap_limit: 3g
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/ready',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
  knowledge-mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: knowledge-mcp
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    restart: unless-stopped
    environment:
      DATABASE_DSN: ${KNOWLEDGE_DATABASE_DSN:?设置平台数据库连接}
      PRINCIPAL_JWKS_FILE: /run/secrets/principal_jwks
      KNOWLEDGE_BOOTSTRAP_TOKEN_FILE: /run/secrets/knowledge_bootstrap_token
    secrets:
    - principal_jwks
    - knowledge_bootstrap_token
    expose:
    - '9108'
    networks:
    - knowledge-internal
    - platform-control
    - egress
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777,uid=10008,gid=10008
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/health',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    image: enterprise-agent/knowledge-mcp:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
  knowledge-sync:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ones-mcp
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    command:
    - python
    - -m
    - app.cli.knowledge_sync_worker
    environment:
      DATABASE_DSN: ${KNOWLEDGE_DATABASE_DSN:?设置平台数据库连接}
      APP_CONFIG_MASTER_KEY_FILE: /run/secrets/app_config_master_key
      APP_ENV: ${APP_ENV:-local}
      ONES_MCP_PROVIDER_ALLOWED_HOSTS: ${ONES_MCP_PROVIDER_ALLOWED_HOSTS:-host.docker.internal}
      ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL: ${ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL:-true}
      KNOWLEDGE_SYNC_ENABLED: 'true'
      KNOWLEDGE_STATE_DIR: /state
    secrets:
    - app_config_master_key
    volumes:
    - knowledge-qdrant:/qdrant/storage:ro
    - knowledge-state:/state
    networks:
    - knowledge-internal
    - egress
    extra_hosts:
    - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777,uid=10003,gid=10003
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    stop_grace_period: 240s
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - app.cli.knowledge_ops
      - health
      - --role
      - sync
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: enterprise-agent/knowledge-sync:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    labels:
      io.enterprise.knowledge.version: ${KNOWLEDGE_IMAGE_TAG}
  knowledge-check:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ones-mcp
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    command:
    - schema
    environment:
      DATABASE_DSN: ${KNOWLEDGE_DATABASE_DSN:?设置平台数据库连接}
      APP_ENV: ${APP_ENV:-local}
      ONES_MCP_PROVIDER_ALLOWED_HOSTS: ${ONES_MCP_PROVIDER_ALLOWED_HOSTS:-host.docker.internal}
      ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL: ${ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL:-true}
      KNOWLEDGE_SYNC_ENABLED: 'true'
      KNOWLEDGE_STATE_DIR: /state
    networks:
    - knowledge-internal
    extra_hosts:
    - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777,uid=10003,gid=10003
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    stop_grace_period: 240s
    restart: 'no'
    image: enterprise-agent/knowledge-sync:${KNOWLEDGE_IMAGE_TAG:?请先构建知识镜像}
    profiles:
    - maintenance
    entrypoint:
    - python
    - -m
    - app.cli.knowledge_preflight
secrets:
  app_config_master_key:
    file: ${APP_CONFIG_MASTER_KEY_FILE:?请配置宿主机 Secret 文件路径}
  principal_jwks:
    file: ${PRINCIPAL_JWKS_FILE:?请配置宿主机 Secret 文件路径}
  knowledge_bootstrap_token:
    file: ${KNOWLEDGE_BOOTSTRAP_TOKEN_FILE:?请配置宿主机 Secret 文件路径}
volumes:
  knowledge-models:
    external: true
    name: ${KNOWLEDGE_MODEL_VOLUME:?请显式绑定已有卷或按安装步骤创建新卷}
  knowledge-reranker-models:
    external: true
    name: ${KNOWLEDGE_RERANKER_VOLUME:?请显式绑定已有卷或按安装步骤创建新卷}
  knowledge-qdrant:
    external: true
    name: ${KNOWLEDGE_QDRANT_VOLUME:?请显式绑定已有卷或按安装步骤创建新卷}
  knowledge-state:
    external: true
    name: ${KNOWLEDGE_STATE_VOLUME:?请显式绑定已有卷或按安装步骤创建新卷}
networks:
  knowledge-internal:
    external: true
    name: ${KNOWLEDGE_CONTENT_NETWORK:?设置共享知识内容网络}
  platform-control:
    external: true
    name: ${KNOWLEDGE_CONTROL_NETWORK:?设置主程序控制网络}
  egress: {}
