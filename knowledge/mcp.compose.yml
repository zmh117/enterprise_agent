# Online retrieval only. Overlay root docker-compose.yml, knowledge/compose.yml,
# then this file. Offline indexing retains its existing two-file configuration.
services:
  api-server:
    environment:
      KNOWLEDGE_BOOTSTRAP_TOKEN_FILE: /run/secrets/knowledge_bootstrap_token
    secrets:
      - knowledge_bootstrap_token

  # 独立在线推理进程；与后台 knowledge-embedding 共享只读固定模型，不共享 busy 锁。
  knowledge-embedding-online:
    profiles: [knowledge]
    image: enterprise-agent/knowledge-embedding:bge-m3-v1
    build:
      context: .
      dockerfile: services/knowledge_embedding/Dockerfile
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - knowledge-models:/models:ro
    networks: [knowledge-internal]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 6g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  knowledge-mcp:
    profiles: [knowledge]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: knowledge-mcp
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    restart: unless-stopped
    environment:
      DATABASE_DSN: ${DATABASE_DSN:?在线知识检索需要平台 DATABASE_DSN}
      PRINCIPAL_JWKS_FILE: /run/secrets/principal_jwks
      KNOWLEDGE_BOOTSTRAP_TOKEN_FILE: /run/secrets/knowledge_bootstrap_token
    secrets:
      - principal_jwks
      - knowledge_bootstrap_token
    expose: ["9108"]
    networks: [knowledge-internal, agent-runtime-control, knowledge-storage-egress]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777,uid=10008,gid=10008"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      knowledge-embedding-online:
        condition: service_healthy
      knowledge-qdrant:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

secrets:
  knowledge_bootstrap_token:
    file: ${HOME}/.config/enterprise-agent/knowledge-bootstrap-token

# Only MCP needs outbound access to administrator-published content endpoints.
# Embedding/Qdrant remain on their existing internal network; no host ports are added.
networks:
  knowledge-storage-egress:
    driver: bridge
