    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 6
    mem_limit: 3g
    memswap_limit: 3g
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/ready',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      knowledge-reranker-prepare:
        condition: service_completed_successfully
  knowledge-mcp:
    build:
