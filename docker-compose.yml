    restart: unless-stopped
    environment:
      CONTROL_API_BASE_URL: http://api-server:8000/api/internal/dingtalk-runtime
      DINGTALK_RUNTIME_AUTH_TOKEN_FILE: /run/secrets/dingtalk_runtime_auth_token
      RUNTIME_ID: ${DINGTALK_RUNTIME_ID:-dingtalk-runtime-1}
      RECONCILE_INTERVAL_MS: ${DINGTALK_RUNTIME_RECONCILE_INTERVAL_MS:-3000}
      CONTROL_API_TIMEOUT_MS: ${DINGTALK_RUNTIME_CONTROL_TIMEOUT_MS:-5000}
      LEASE_ACQUIRE_TIMEOUT_MS: ${DINGTALK_RUNTIME_LEASE_ACQUIRE_TIMEOUT_MS:-30000}
      LEASE_ACQUIRE_RETRY_MS: ${DINGTALK_RUNTIME_LEASE_ACQUIRE_RETRY_MS:-1000}
      HEALTH_PORT: "8081"
    secrets:
      - dingtalk_runtime_auth_token
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agent-worker:
    deploy:
      replicas: 2
    stop_grace_period: 70m
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
      args: *release-build-args
    command: ["python", "-m", "app.workers.agent_job_worker"]
    environment:
      <<: *worker-env
      RUNTIME_GRANT_PRIVATE_KEY_FILE: /run/secrets/runtime_grant_private_key
      PRINCIPAL_JWT_PRIVATE_KEY_FILE: /run/secrets/principal_jwt_private_key
    secrets:
      - app_config_master_key
      - runtime_grant_private_key
      - principal_jwt_private_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      tool-mcp:
        condition: service_healthy
      ones-mcp:
        condition: service_healthy
      dingtalk-mcp:
        condition: service_healthy
      python-agent-runtime-a:
        condition: service_started
      python-agent-runtime-b:
        condition: service_started
      file-service:
        condition: service_healthy
    networks:
      - default
      - agent-runtime-control

  job-dispatch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.job_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/job-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  delivery-dispatch-worker:
