        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/job-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

