x-database-env: &database-env
  DATABASE_DSN: postgresql://enterprise_agent:enterprise_agent@postgres:5432/enterprise_agent
  APP_CONFIG_MASTER_KEY_FILE: /run/secrets/app_config_master_key

x-runtime-env: &runtime-env
  <<: *database-env
  APP_ENV: ${APP_ENV:-local}
  # Local seed is an explicit bootstrap action. Runtime service restarts must
  # not replay seed data over control-plane managed configuration.
  SEED_LOCAL_CONFIG: ${SEED_LOCAL_CONFIG:-false}
  FEATURE_WEB_ADMIN: ${FEATURE_WEB_ADMIN:-false}
  FEATURE_PUBLISHED_AGENT_RUNTIME: ${FEATURE_PUBLISHED_AGENT_RUNTIME:-false}
  FEATURE_REAL_CLAUDE: ${FEATURE_REAL_CLAUDE:-false}
  WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-true}
  WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-}
  DINGTALK_RUNTIME_AUTH_TOKEN_FILE: /run/secrets/dingtalk_runtime_auth_token
  # 模型连接由管理端配置，部署环境只负责限制允许访问的主机。
  # 内部网关示例：api.deepseek.com,aikeyhub.gateway.mdzy
  MODEL_PROVIDER_HOST_ALLOWLIST: ${MODEL_PROVIDER_HOST_ALLOWLIST:-api.deepseek.com}
  PYTHON_AGENT_RUNTIME_URL: http://python-agent-runtime:8091
  PYTHON_AGENT_RUNTIME_ALLOWED_HOSTS: python-agent-runtime
  AGENT_RUNTIME_ALLOW_INSECURE_INTERNAL_HTTP: "true"

x-worker-env: &worker-env
  <<: *runtime-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

x-api-env: &api-env
  <<: *worker-env
  MODEL_PROBE_AUTH_TOKEN_FILE: /run/secrets/model_probe_auth_token
  SERVICE_PRINCIPAL_ENABLED: "true"
  PRINCIPAL_JWT_PRIVATE_KEY_FILE: /run/secrets/principal_jwt_private_key
  FILE_WORKER_BOOTSTRAP_TOKEN_FILE: /run/secrets/file_worker_bootstrap_token
  FILE_PROCESSING_WORKER_BOOTSTRAP_TOKEN_FILE: /run/secrets/file_processing_worker_bootstrap_token
  FILE_PROCESSING_WORKER_INTERNAL_BASE_URL: http://file-processing-worker:9106
  FILE_PROCESSING_WORKER_INTERNAL_ALLOWED_HOSTS: file-processing-worker
  DOCUMENT_LAYOUT_OCR_ENABLED: "true"
  DOCUMENT_LAYOUT_OCR_PROFILE_HASH: c3f6d45b3d23f70727e047158f20b1e798fa9a6d188aa11b8985385a1bc79cb8
  DOCLING_MODEL_ARTIFACT_DIGEST: sha256:9e53a21c25853b53fa0b46df02bb8ebad1d5087dee342d7ef412efecaad0912c
  DELIVERY_WORKER_BOOTSTRAP_TOKEN_FILE: /run/secrets/delivery_worker_bootstrap_token
  SERVICE_PRINCIPAL_TTL_SECONDS: ${SERVICE_PRINCIPAL_TTL_SECONDS:-300}
  # ONES 本人身份验证只由 API 发起；固定 Provider 配置不得下发给
  # Worker、Runtime 或 MCP，也不依赖已退役的 API Connection。
  ONES_IDENTITY_INSTANCE_CODE: ${ONES_IDENTITY_INSTANCE_CODE:-default}
  ONES_IDENTITY_DISPLAY_NAME: ${ONES_IDENTITY_DISPLAY_NAME:-ONES}
  # 本地 Mock 作为独立 Compose 服务发布到宿主机 19121 端口；主 Compose
  # 通过 host.docker.internal 访问。生产仍必须覆盖为受信 HTTPS Provider。
  ONES_IDENTITY_BASE_URL: ${ONES_IDENTITY_BASE_URL:-http://host.docker.internal:19121}
  ONES_IDENTITY_ALLOWED_HOSTS: ${ONES_IDENTITY_ALLOWED_HOSTS:-host.docker.internal}
  ONES_IDENTITY_TIMEOUT_SECONDS: ${ONES_IDENTITY_TIMEOUT_SECONDS:-5}
  ONES_IDENTITY_MAX_RESPONSE_BYTES: ${ONES_IDENTITY_MAX_RESPONSE_BYTES:-65536}
  ONES_IDENTITY_ALLOW_INSECURE_LOCAL: ${ONES_IDENTITY_ALLOW_INSECURE_LOCAL:-true}
  ONES_IDENTITY_CHALLENGE_TTL_SECONDS: ${ONES_IDENTITY_CHALLENGE_TTL_SECONDS:-600}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
    environment:
      POSTGRES_DB: enterprise_agent
      POSTGRES_USER: enterprise_agent
      POSTGRES_PASSWORD: enterprise_agent
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_agent -d enterprise_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - agent-runtime-control

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      DATABASE_DSN: postgresql://enterprise_agent:enterprise_agent@postgres:5432/enterprise_agent
      APP_ENV: ${APP_ENV:-local}
      MIGRATOR_BUILD: ${MIGRATOR_BUILD:-local-compose}
      INITIAL_ADMIN_PASSWORD_FILE: ${INITIAL_ADMIN_PASSWORD_FILE:-/run/secrets/initial_admin_password}
      AGENT_RUNTIME_DATABASE_PASSWORD: ${AGENT_RUNTIME_DATABASE_PASSWORD:-agent_runtime_reader_local}
      APP_CONFIG_MASTER_KEY_FILE: /run/secrets/app_config_master_key
      FILE_STORAGE_SECRET_BOOTSTRAP_ENABLED: ${FILE_STORAGE_SECRET_BOOTSTRAP_ENABLED:-false}
      FILE_STORAGE_BOOTSTRAP_ACCESS_KEY_FILE: /run/secrets/file_storage_bootstrap_access_key
      FILE_STORAGE_BOOTSTRAP_SECRET_KEY_FILE: /run/secrets/file_storage_bootstrap_secret_key
    command:
      - /bin/sh
      - -ec
      - python -m app.cli.migrate && python -m app.cli.bootstrap_file_storage_secrets && python -m app.cli.bootstrap_admin --non-interactive && python -m app.cli.bootstrap_agents && python -m app.cli.apply_agent_runtime_grants
    secrets:
      - app_config_master_key
      - file_storage_bootstrap_access_key
      - file_storage_bootstrap_secret_key
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq4-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # profiles: ["attachments"]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${APP_ENV:-local}" in
          local|test|testing|development) ;;
          *)
            if [ -z "$${MINIO_ROOT_USER:-}" ] || [ -z "$${MINIO_ROOT_PASSWORD:-}" ] ||
               [ "$${MINIO_ROOT_USER}" = "enterprise_agent" ] ||
               [ "$${MINIO_ROOT_PASSWORD}" = "enterprise_agent_change_me" ] ||
               [ "$${MINIO_ROOT_PASSWORD}" = "replace-with-a-strong-object-storage-secret" ]; then
              echo "unsafe MinIO credentials for non-local APP_ENV" >&2
              exit 1
            fi
            ;;
        esac
        exec minio server /data --console-address :9001
    environment:
      APP_ENV: ${APP_ENV:-local}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enterprise_agent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-enterprise_agent_change_me}
    ports:
      # 宿主机默认避开常见 9000 占用；容器内仍是 9000/9001。
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    # profiles: ["attachments"]
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        case "$${APP_ENV:-local}" in
          local|test|testing|development) ;;
          *)
            if [ -z "$${MINIO_ROOT_USER:-}" ] || [ -z "$${MINIO_ROOT_PASSWORD:-}" ] ||
               [ "$${MINIO_ROOT_USER}" = "enterprise_agent" ] ||
               [ "$${MINIO_ROOT_PASSWORD}" = "enterprise_agent_change_me" ] ||
               [ "$${MINIO_ROOT_PASSWORD}" = "replace-with-a-strong-object-storage-secret" ]; then
              echo "unsafe MinIO credentials for non-local APP_ENV" >&2;
              exit 1;
            fi
            ;;
        esac;
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${FILE_STORAGE_LEGACY_ATTACHMENT_BUCKET}" &&
        mc anonymous set none "local/$${FILE_STORAGE_LEGACY_ATTACHMENT_BUCKET}" &&
        mc mb --ignore-existing "local/$${FILE_STORAGE_BUCKET}" &&
        mc anonymous set none "local/$${FILE_STORAGE_BUCKET}"
    environment:
      APP_ENV: ${APP_ENV:-local}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enterprise_agent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-enterprise_agent_change_me}
      FILE_STORAGE_LEGACY_ATTACHMENT_BUCKET: ${FILE_STORAGE_LEGACY_ATTACHMENT_BUCKET:-agent-attachments}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-agent-files}
    depends_on:
      minio:
        condition: service_healthy

  tool-mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tool-mcp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=10001,gid=10001
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *runtime-env
    secrets:
      - app_config_master_key
    expose:
      - "9103"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9103/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - agent-runtime-control
      - provider-egress

  ones-mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ones-mcp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777,uid=10003,gid=10003
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *database-env
      APP_ENV: ${APP_ENV:-local}
      SEED_LOCAL_CONFIG: "false"
      PRINCIPAL_JWKS_FILE: /run/secrets/principal_jwks
      ONES_MCP_PROVIDER_BASE_URL: ${ONES_MCP_PROVIDER_BASE_URL:-http://host.docker.internal:19121}
      ONES_MCP_PROVIDER_ALLOWED_HOSTS: ${ONES_MCP_PROVIDER_ALLOWED_HOSTS:-host.docker.internal}
      ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL: ${ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL:-true}
      ONES_MCP_PROVIDER_TIMEOUT_SECONDS: ${ONES_MCP_PROVIDER_TIMEOUT_SECONDS:-5}
      ONES_MCP_PROVIDER_MAX_RESPONSE_BYTES: ${ONES_MCP_PROVIDER_MAX_RESPONSE_BYTES:-262144}
      ONES_MCP_MAX_REQUEST_BYTES: ${ONES_MCP_MAX_REQUEST_BYTES:-32768}
      MCP_OPERATION_AUDIT_RETENTION_DAYS: ${MCP_OPERATION_AUDIT_RETENTION_DAYS:-90}
    secrets:
      - app_config_master_key
      - principal_jwks
    expose:
      - "9104"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9104/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - agent-runtime-control
      - provider-egress

  file-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: file-service
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=10005,gid=10005
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *database-env
      APP_ENV: ${APP_ENV:-local}
      SEED_LOCAL_CONFIG: "false"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PRINCIPAL_JWKS_FILE: /run/secrets/principal_jwks
      FILE_STORAGE_ENDPOINT_URL: ${FILE_STORAGE_ENDPOINT_URL:-http://minio:9000}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-agent-files}
      FILE_STORAGE_LEGACY_ATTACHMENT_BUCKET: ${FILE_STORAGE_LEGACY_ATTACHMENT_BUCKET:-agent-attachments}
      FILE_STORAGE_ACCESS_KEY_REF: ${FILE_STORAGE_ACCESS_KEY_REF:-secret://platform/minio-file-access-key}
      FILE_STORAGE_SECRET_KEY_REF: ${FILE_STORAGE_SECRET_KEY_REF:-secret://platform/minio-file-secret-key}
      FILE_STORAGE_REGION: ${FILE_STORAGE_REGION:-us-east-1}
      FILE_STORAGE_SECURE: ${FILE_STORAGE_SECURE:-false}
      FILE_JWKS_REFRESH_SECONDS: ${FILE_JWKS_REFRESH_SECONDS:-60}
      FILE_MCP_MAX_REQUEST_BYTES: ${FILE_MCP_MAX_REQUEST_BYTES:-32768}
      DOCUMENT_PROCESSOR_VERSION: v1.30.0
      DOCUMENT_PROCESSOR_BUILD_DIGEST: sha256:0244089785d5ccb7570dfaa593cdc81ec64a1aadc63ffa9dce065064b0a6a807
    secrets:
      - app_config_master_key
      - principal_jwks
    expose:
      - "9105"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - default
      - agent-runtime-control

  python-agent-runtime:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: python-agent-runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/python-agent-runtime:size=${AGENT_RUNTIME_TMPFS_SIZE:-256m},mode=0700,uid=10002,gid=10002
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *runtime-env
      HOME: /tmp/python-agent-runtime
      TMPDIR: /tmp/python-agent-runtime
      CLAUDE_CONFIG_DIR: /tmp/python-agent-runtime/.claude
      DATABASE_DSN: ${AGENT_RUNTIME_DATABASE_DSN:-postgresql://agent_runtime_reader:agent_runtime_reader_local@postgres:5432/enterprise_agent}
      RUNTIME_GRANT_PUBLIC_KEY_FILE: /run/secrets/runtime_grant_public_key
      MODEL_PROBE_AUTH_TOKEN_FILE: /run/secrets/model_probe_auth_token
      MCP_TOOL_SERVER_URL: http://tool-mcp:9103/mcp
      ONES_MCP_SERVER_URL: http://ones-mcp:9104/mcp
      FILE_MCP_SERVER_URL: http://file-service:9105/mcp
      PYTHON_AGENT_RUNTIME_SANDBOX_ROOT: /tmp/python-agent-runtime/sandboxes
      PYTHON_AGENT_RUNTIME_SANDBOX_CAPACITY_BYTES: ${AGENT_RUNTIME_SANDBOX_CAPACITY_BYTES:-234881024}
      PYTHON_AGENT_RUNTIME_SANDBOX_MAX_FILES: ${AGENT_RUNTIME_SANDBOX_MAX_FILES:-64}
      PYTHON_AGENT_RUNTIME_SANDBOX_MAX_FILE_BYTES: ${AGENT_RUNTIME_SANDBOX_MAX_FILE_BYTES:-15728640}
      PYTHON_AGENT_RUNTIME_SANDBOX_MAX_INPUT_FILES: ${AGENT_RUNTIME_SANDBOX_MAX_INPUT_FILES:-40}
      PYTHON_AGENT_RUNTIME_SANDBOX_MAX_WORK_OUTPUT_FILES: ${AGENT_RUNTIME_SANDBOX_MAX_WORK_OUTPUT_FILES:-16}
      PYTHON_AGENT_RUNTIME_SANDBOX_MAX_TMP_FILES: ${AGENT_RUNTIME_SANDBOX_MAX_TMP_FILES:-8}
      PYTHON_AGENT_RUNTIME_SANDBOX_CLEANUP_INTERVAL_SECONDS: ${AGENT_RUNTIME_SANDBOX_CLEANUP_INTERVAL_SECONDS:-300}
      PYTHON_AGENT_RUNTIME_CLI_VERSION: "2.1.226"
      PYTHON_AGENT_RUNTIME_LEDGER_TTL_SECONDS: ${PYTHON_AGENT_RUNTIME_LEDGER_TTL_SECONDS:-3600}
      AGENT_RUNTIME_TEST_PROVIDER_MODE: ${AGENT_RUNTIME_TEST_PROVIDER_MODE:-disabled}
    secrets:
      - app_config_master_key
      - runtime_grant_public_key
      - model_probe_auth_token
    expose:
      - "8091"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      tool-mcp:
        condition: service_healthy
      ones-mcp:
        condition: service_healthy
      file-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - agent-runtime-control
      - provider-egress

  api-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api-server
    command:
      ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *api-env
    secrets:
      - dingtalk_runtime_auth_token
      - app_config_master_key
      - model_probe_auth_token
      - principal_jwt_private_key
      - file_worker_bootstrap_token
      - file_processing_worker_bootstrap_token
      - delivery_worker_bootstrap_token
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      python-agent-runtime:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - default
      - agent-runtime-control

  # Deterministic provider behavior remains disabled in normal Compose.

  admin-web:
    # profiles: ["admin"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FEATURE_WEB_ADMIN: ${FEATURE_WEB_ADMIN:-false}
    ports:
      - "${ADMIN_WEB_PORT:-8080}:80"
    depends_on:
      - api-server

  dingtalk-runtime:
    build:
      context: .
      dockerfile: dingtalk-runtime/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_API_BASE_URL: http://api-server:8000/api/internal/dingtalk-runtime
      DINGTALK_RUNTIME_AUTH_TOKEN_FILE: /run/secrets/dingtalk_runtime_auth_token
      RUNTIME_ID: ${DINGTALK_RUNTIME_ID:-dingtalk-runtime-1}
      RECONCILE_INTERVAL_MS: ${DINGTALK_RUNTIME_RECONCILE_INTERVAL_MS:-3000}
      CONTROL_API_TIMEOUT_MS: ${DINGTALK_RUNTIME_CONTROL_TIMEOUT_MS:-5000}
      LEASE_ACQUIRE_TIMEOUT_MS: ${DINGTALK_RUNTIME_LEASE_ACQUIRE_TIMEOUT_MS:-30000}
      LEASE_ACQUIRE_RETRY_MS: ${DINGTALK_RUNTIME_LEASE_ACQUIRE_RETRY_MS:-1000}
      HEALTH_PORT: "8081"
    secrets:
      - dingtalk_runtime_auth_token
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agent-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.agent_job_worker"]
    environment:
      <<: *worker-env
      RUNTIME_GRANT_PRIVATE_KEY_FILE: /run/secrets/runtime_grant_private_key
      PRINCIPAL_JWT_PRIVATE_KEY_FILE: /run/secrets/principal_jwt_private_key
    secrets:
      - app_config_master_key
      - runtime_grant_private_key
      - principal_jwt_private_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      tool-mcp:
        condition: service_healthy
      ones-mcp:
        condition: service_healthy
      python-agent-runtime:
        condition: service_healthy
      file-service:
        condition: service_healthy
    networks:
      - default
      - agent-runtime-control

  job-dispatch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.job_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/job-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  delivery-dispatch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.delivery_dispatch_worker"]
    environment:
      <<: *worker-env
      FILE_SERVICE_INTERNAL_BASE_URL: http://file-service:9105
      FILE_SERVICE_INTERNAL_ALLOWED_HOSTS: file-service
      SERVICE_PRINCIPAL_ENABLED: "true"
      SERVICE_IDENTITY_INTERNAL_BASE_URL: http://api-server:8000
      SERVICE_IDENTITY_INTERNAL_ALLOWED_HOSTS: api-server
      DELIVERY_WORKER_BOOTSTRAP_TOKEN_FILE: /run/secrets/delivery_worker_bootstrap_token
      SERVICE_IDENTITY_TIMEOUT_SECONDS: ${SERVICE_IDENTITY_TIMEOUT_SECONDS:-5}
      SERVICE_PRINCIPAL_REFRESH_SKEW_SECONDS: ${SERVICE_PRINCIPAL_REFRESH_SKEW_SECONDS:-60}
    secrets:
      - app_config_master_key
      - delivery_worker_bootstrap_token
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      file-service:
        condition: service_healthy
      api-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/delivery-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  webhook-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.webhook_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      python-agent-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/webhook-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - default
      - agent-runtime-control

  channel-dispatch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.channel_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      python-agent-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/channel-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks:
      - default
      - agent-runtime-control

  file-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.file_worker"]
    environment:
      <<: *worker-env
      FILE_SERVICE_INTERNAL_BASE_URL: http://file-service:9105
      FILE_SERVICE_INTERNAL_ALLOWED_HOSTS: file-service
      SERVICE_PRINCIPAL_ENABLED: "true"
      SERVICE_IDENTITY_INTERNAL_BASE_URL: http://api-server:8000
      SERVICE_IDENTITY_INTERNAL_ALLOWED_HOSTS: api-server
      FILE_WORKER_BOOTSTRAP_TOKEN_FILE: /run/secrets/file_worker_bootstrap_token
      SERVICE_IDENTITY_TIMEOUT_SECONDS: ${SERVICE_IDENTITY_TIMEOUT_SECONDS:-5}
      SERVICE_PRINCIPAL_REFRESH_SKEW_SECONDS: ${SERVICE_PRINCIPAL_REFRESH_SKEW_SECONDS:-60}
    secrets:
      - app_config_master_key
      - file_worker_bootstrap_token
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      file-service:
        condition: service_healthy
      api-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,time; from pathlib import Path; h=Path('/tmp/file-worker.heartbeat'); s=Path('/tmp/file-worker.status.json'); v=json.loads(s.read_text()) if s.exists() else {}; ok=h.exists() and time.time()-h.stat().st_mtime < 120 and v.get('rabbitmq')=='ready' and v.get('file_service')=='ready'; raise SystemExit(0 if ok else 1)"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  docling-serve:
    build:
      context: .
      dockerfile: backend/docker/docling-serve/Dockerfile
    image: enterprise-agent/docling-serve:v1.30.0-layout-ocr-v2
    restart: unless-stopped
    user: "1001:0"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=0700,uid=1001,gid=0
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        api_key="$$(cat /run/secrets/docling_api_key)"
        test -n "$${api_key}"
        python /opt/enterprise-agent/verify_model_bundle.py
        export DOCLING_SERVE_API_KEY="$${api_key}"
        exec docling-serve run
    environment:
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "4"
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_MANAGEMENT_ENDPOINTS: "false"
      DOCLING_SERVE_SHOW_VERSION_INFO: "false"
      DOCLING_SERVE_DEBUG_ERROR_DETAILS: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_CODE_FORMULA_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_TABLE_STRUCTURE_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_LAYOUT_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_CLASSIFICATION_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_OCR_CONFIG: "false"
      DOCLING_SERVE_ALLOWED_SOURCE_TYPES: "[]"
      DOCLING_SERVE_ALLOWED_TARGET_TYPES: '["inbody","zip"]'
      DOCLING_SERVE_ALLOWED_IMAGE_EXPORT_MODES: '["placeholder","referenced"]'
      DOCLING_SERVE_MAX_FILE_SIZE: "26214400"
      DOCLING_SERVE_MAX_NUM_PAGES: "300"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "600"
      DOCLING_SERVE_SINGLE_USE_RESULTS: "true"
      DOCLING_SERVE_SCRATCH_PATH: /tmp/docling-scratch
      DOCLING_SERVE_ARTIFACTS_PATH: /opt/app-root/src/.cache/docling/models
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_LOG_FORMAT: json
      DOCLING_SERVE_LOG_LEVEL: WARNING
      DOCLING_MODEL_ARTIFACT_PATH: /opt/app-root/src/.cache/docling/models
      DOCLING_MODEL_ARTIFACT_DIGEST: sha256:9e53a21c25853b53fa0b46df02bb8ebad1d5087dee342d7ef412efecaad0912c
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # torch.compile writes a shared object into the inductor cache and dlopens it,
      # which cannot work while /tmp stays noexec. Stay in eager mode instead of
      # granting this container an executable writable directory.
      TORCH_COMPILE_DISABLE: "1"
      TORCHDYNAMO_DISABLE: "1"
    secrets:
      - docling_api_key
    expose:
      - "5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 256
    networks:
      - document-processing

  file-processing-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: file-processing-worker
    command: ["python", "-m", "app.workers.file_processing_worker"]
    restart: unless-stopped
    user: "10006:10006"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=0700,uid=10006,gid=10006
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    environment:
      APP_ENV: ${APP_ENV:-local}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      FILE_PROCESSING_QUEUE: agent.file.processing.queue
      FILE_PROCESSING_RETRY_QUEUE: agent.file.processing.retry.queue
      FILE_PROCESSING_DEAD_QUEUE: agent.file.processing.dead.queue
      FILE_PROCESSING_MAX_ATTEMPTS: "3"
      FILE_PROCESSING_RETRY_BASE_SECONDS: "30"
      FILE_PROCESSING_WORKER_CONCURRENCY: "1"
      FILE_PROCESSING_WORKER_READINESS_HOST: 0.0.0.0
      FILE_PROCESSING_WORKER_READINESS_PORT: "9106"
      FILE_SERVICE_INTERNAL_BASE_URL: http://file-service:9105
      FILE_SERVICE_INTERNAL_ALLOWED_HOSTS: file-service
      FILE_SERVICE_INTERNAL_TIMEOUT_SECONDS: "30"
      SERVICE_PRINCIPAL_ENABLED: "true"
      SERVICE_IDENTITY_INTERNAL_BASE_URL: http://api-server:8000
      SERVICE_IDENTITY_INTERNAL_ALLOWED_HOSTS: api-server
      FILE_PROCESSING_WORKER_BOOTSTRAP_TOKEN_FILE: /run/secrets/file_processing_worker_bootstrap_token
      SERVICE_IDENTITY_TIMEOUT_SECONDS: ${SERVICE_IDENTITY_TIMEOUT_SECONDS:-5}
      SERVICE_PRINCIPAL_REFRESH_SKEW_SECONDS: ${SERVICE_PRINCIPAL_REFRESH_SKEW_SECONDS:-60}
      DOCLING_SERVE_INTERNAL_BASE_URL: http://docling-serve:5001
      DOCLING_SERVE_INTERNAL_ALLOWED_HOSTS: docling-serve
      DOCLING_SERVE_API_KEY_FILE: /run/secrets/docling_api_key
      DOCLING_SERVE_CONNECT_TIMEOUT_SECONDS: "5"
      DOCLING_SERVE_POLL_INTERVAL_SECONDS: "2"
      DOCLING_SERVE_TOTAL_TIMEOUT_SECONDS: "600"
      DOCLING_SERVE_MAX_RESPONSE_BYTES: "134217728"
      DOCUMENT_LAYOUT_OCR_ENABLED: "true"
      DOCUMENT_LAYOUT_OCR_PROFILE_HASH: c3f6d45b3d23f70727e047158f20b1e798fa9a6d188aa11b8985385a1bc79cb8
      DOCLING_MODEL_ARTIFACT_DIGEST: sha256:9e53a21c25853b53fa0b46df02bb8ebad1d5087dee342d7ef412efecaad0912c
    secrets:
      - file_processing_worker_bootstrap_token
      - docling_api_key
    expose:
      - "9106"
    depends_on:
      rabbitmq:
        condition: service_healthy
      file-service:
        condition: service_healthy
      api-server:
        condition: service_healthy
      docling-serve:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9106/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
          pids: 128
    networks:
      - default
      - document-processing

secrets:
  app_config_master_key:
    file: ${APP_CONFIG_MASTER_KEY_FILE:-${HOME}/.config/enterprise-agent/app-config-master-key}
  dingtalk_runtime_auth_token:
    environment: DINGTALK_RUNTIME_AUTH_TOKEN
  runtime_grant_private_key:
    file: ${RUNTIME_GRANT_PRIVATE_KEY_FILE:-${HOME}/.config/enterprise-agent/runtime-grant-private.pem}
  runtime_grant_public_key:
    file: ${RUNTIME_GRANT_PUBLIC_KEY_FILE:-${HOME}/.config/enterprise-agent/runtime-grant-public.pem}
  principal_jwt_private_key:
    file: ${PRINCIPAL_JWT_PRIVATE_KEY_FILE:-${HOME}/.config/enterprise-agent/principal-jwt-private.pem}
  principal_jwks:
    file: ${PRINCIPAL_JWKS_FILE:-${HOME}/.config/enterprise-agent/principal-jwks.json}
  file_worker_bootstrap_token:
    file: ${FILE_WORKER_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/file-worker-bootstrap-token}
  file_processing_worker_bootstrap_token:
    file: ${FILE_PROCESSING_WORKER_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/file-processing-worker-bootstrap-token}
  delivery_worker_bootstrap_token:
    file: ${DELIVERY_WORKER_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/delivery-worker-bootstrap-token}
  docling_api_key:
    file: ${DOCLING_SERVE_API_KEY_FILE:-${HOME}/.config/enterprise-agent/docling-api-key}
  file_storage_bootstrap_access_key:
    environment: MINIO_ROOT_USER
  file_storage_bootstrap_secret_key:
    environment: MINIO_ROOT_PASSWORD
  model_probe_auth_token:
    file: ${MODEL_PROBE_AUTH_TOKEN_FILE:-${HOME}/.config/enterprise-agent/model-probe-auth-token}

volumes:
  postgres18-data:
    name: enterprise_agent_postgres18_data
    external: ${POSTGRES18_VOLUME_EXTERNAL:-false}
  rabbitmq4-data:
    name: enterprise_agent_rabbitmq4_data
  minio-data:
    name: enterprise_agent_minio_data

networks:
  agent-runtime-control:
    internal: true
  document-processing:
    internal: true
  provider-egress: {}
