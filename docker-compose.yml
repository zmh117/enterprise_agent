x-database-env: &database-env
  DATABASE_DSN: postgresql://enterprise_agent:enterprise_agent@postgres:5432/enterprise_agent
  APP_CONFIG_MASTER_KEY_FILE: /run/secrets/app_config_master_key

x-runtime-env: &runtime-env
  <<: *database-env
  APP_ENV: ${APP_ENV:-local}
  # Local seed is an explicit bootstrap action. Runtime service restarts must
  # not replay seed data over control-plane managed configuration.
  SEED_LOCAL_CONFIG: ${SEED_LOCAL_CONFIG:-false}
  FEATURE_WEB_ADMIN: ${FEATURE_WEB_ADMIN:-false}
  FEATURE_PUBLISHED_AGENT_RUNTIME: ${FEATURE_PUBLISHED_AGENT_RUNTIME:-false}
  FEATURE_REAL_CLAUDE: ${FEATURE_REAL_CLAUDE:-false}
  FEATURE_REAL_INTERNAL_TOOLS: ${FEATURE_REAL_INTERNAL_TOOLS:-false}
  WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-true}
  WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-}
  ONES_IDENTITY_BASE_URL: ${ONES_IDENTITY_BASE_URL:-}
  ONES_IDENTITY_ALLOWED_HOSTS: ${ONES_IDENTITY_ALLOWED_HOSTS:-}
  ONES_IDENTITY_ALLOW_INSECURE_LOCAL: ${ONES_IDENTITY_ALLOW_INSECURE_LOCAL:-false}
  # 容器网络地址作为数据库运行配置不可用时的安全回退。
  INTERNAL_API_BASE_URL: http://internal-api-platform:9000
  INTERNAL_API_AUTH_TOKEN_FILE: /run/secrets/internal_api_auth_token
  DINGTALK_RUNTIME_AUTH_TOKEN_FILE: /run/secrets/dingtalk_runtime_auth_token
  # 模型连接由管理端配置，部署环境只负责限制允许访问的主机。
  MODEL_PROVIDER_HOST_ALLOWLIST: ${MODEL_PROVIDER_HOST_ALLOWLIST:-api.deepseek.com}
  # 附件存储仍属于部署基础设施，不由业务配置数据库托管。
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-enterprise_agent}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-enterprise_agent_change_me}
  S3_BUCKET: ${S3_BUCKET:-agent-attachments}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_SECURE: ${S3_SECURE:-false}

x-worker-env: &worker-env
  <<: *runtime-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_DB: enterprise_agent
      POSTGRES_USER: enterprise_agent
      POSTGRES_PASSWORD: enterprise_agent
    ports:
      - "5433:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_agent -d enterprise_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
    environment:
      DATABASE_DSN: postgresql://enterprise_agent:enterprise_agent@postgres:5432/enterprise_agent
      APP_ENV: ${APP_ENV:-local}
      MIGRATOR_BUILD: ${MIGRATOR_BUILD:-local-compose}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq4-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # profiles: ["attachments"]
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-enterprise_agent}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-enterprise_agent_change_me}
    ports:
      # 宿主机默认避开常见 9000 占用；容器内仍是 9000/9001，S3_ENDPOINT_URL 继续用 http://minio:9000
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    # profiles: ["attachments"]
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-enterprise_agent}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-enterprise_agent_change_me}
      S3_BUCKET: ${S3_BUCKET:-agent-attachments}
    depends_on:
      minio:
        condition: service_healthy

  mock-internal-api-platform:
    profiles: ["mock-tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: mock-internal-api-platform
    command:
      ["python", "-m", "uvicorn", "app.mock_internal_api_platform:create_app", "--factory", "--host", "0.0.0.0", "--port", "9000"]
    expose:
      - "9000"

  local-internal-api-platform:
    profiles: ["local-tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      ["python", "-m", "uvicorn", "app.local_internal_api_platform:create_app", "--factory", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      <<: *runtime-env
    expose:
      - "9000"
    depends_on:
      migrator:
        condition: service_completed_successfully

  # real-tools: 拓扑感知、多数据源、只读 Internal API Platform。
  internal-api-platform:
    # profiles: ["real-tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: internal-api-platform
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        no_proxy: ${no_proxy:-}
        NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
    command:
      ["python", "-m", "uvicorn", "app.internal_api_platform:create_app", "--factory", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      <<: *runtime-env
    secrets:
      - source: internal_api_server_auth_tokens
        target: internal_api_auth_token
      - app_config_master_key
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api-server
    command:
      ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *worker-env
    secrets:
      - dingtalk_runtime_auth_token
      - source: internal_api_client_auth_token
        target: internal_api_auth_token
      - app_config_master_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  builtin-tool-compose-acceptance:
    profiles: ["builtin-tool-acceptance"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builtin-tool-compose-acceptance
    command: ["python", "-m", "app.acceptance.builtin_tool_composition"]
    environment:
      DATABASE_DSN: "sqlite:///:memory:"
      APP_ENV: compose-acceptance
    restart: "no"

  admin-web:
    # profiles: ["admin"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${ADMIN_WEB_PORT:-8080}:80"
    depends_on:
      - api-server

  dingtalk-runtime:
    build:
      context: .
      dockerfile: dingtalk-runtime/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_API_BASE_URL: http://api-server:8000/api/internal/dingtalk-runtime
      DINGTALK_RUNTIME_AUTH_TOKEN_FILE: /run/secrets/dingtalk_runtime_auth_token
      RUNTIME_ID: ${DINGTALK_RUNTIME_ID:-dingtalk-runtime-1}
      RECONCILE_INTERVAL_MS: ${DINGTALK_RUNTIME_RECONCILE_INTERVAL_MS:-3000}
      CONTROL_API_TIMEOUT_MS: ${DINGTALK_RUNTIME_CONTROL_TIMEOUT_MS:-5000}
      LEASE_ACQUIRE_TIMEOUT_MS: ${DINGTALK_RUNTIME_LEASE_ACQUIRE_TIMEOUT_MS:-30000}
      LEASE_ACQUIRE_RETRY_MS: ${DINGTALK_RUNTIME_LEASE_ACQUIRE_RETRY_MS:-1000}
      HEALTH_PORT: "8081"
    secrets:
      - dingtalk_runtime_auth_token
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agent-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.agent_job_worker"]
    environment:
      <<: *worker-env
    secrets:
      - source: internal_api_client_auth_token
        target: internal_api_auth_token
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  job-dispatch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.job_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - source: internal_api_client_auth_token
        target: internal_api_auth_token
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/job-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  delivery-dispatch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.delivery_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - source: internal_api_client_auth_token
        target: internal_api_auth_token
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/delivery-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  webhook-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.webhook_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - source: internal_api_client_auth_token
        target: internal_api_auth_token
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/webhook-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  channel-dispatch-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.channel_dispatch_worker"]
    environment:
      <<: *worker-env
    secrets:
      - source: internal_api_client_auth_token
        target: internal_api_auth_token
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/channel-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  attachment-worker:
    # profiles: ["attachments"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: agent-worker
    command: ["python", "-m", "app.workers.attachment_worker"]
    environment:
      <<: *worker-env
    secrets:
      - source: internal_api_client_auth_token
        target: internal_api_auth_token
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

secrets:
  app_config_master_key:
    file: ${APP_CONFIG_MASTER_KEY_FILE:-${HOME}/.config/enterprise-agent/app-config-master-key}
  dingtalk_runtime_auth_token:
    environment: DINGTALK_RUNTIME_AUTH_TOKEN
  internal_api_server_auth_tokens:
    file: ${INTERNAL_API_SERVER_AUTH_TOKENS_FILE:-${HOME}/.config/enterprise-agent/internal-api-server-auth-tokens}
  internal_api_client_auth_token:
    file: ${INTERNAL_API_CLIENT_AUTH_TOKEN_FILE:-${HOME}/.config/enterprise-agent/internal-api-client-auth-token}

volumes:
  postgres18-data:
    name: enterprise_agent_postgres18_data
  rabbitmq4-data:
    name: enterprise_agent_rabbitmq4_data
  minio-data:
    name: enterprise_agent_minio_data
