        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    restart: unless-stopped
    environment:
      DATABASE_DSN: *platform-dsn
      PRINCIPAL_JWKS_FILE: /run/secrets/principal_jwks
      KNOWLEDGE_BOOTSTRAP_TOKEN_FILE: /run/secrets/knowledge_bootstrap_token
      KNOWLEDGE_ACCESS_MODE: ${KNOWLEDGE_ACCESS_MODE-online}
    secrets:
    - principal_jwks
    - knowledge_bootstrap_token
    expose:
    - '9108'
    networks:
    - knowledge-managed
    - agent-runtime-control
    - provider-egress
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777,uid=10008,gid=10008
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/health',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    image: enterprise-agent/knowledge-mcp:local
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      knowledge-embedding-online:
        condition: service_healthy
      knowledge-reranker:
        condition: service_healthy
      knowledge-qdrant:
        condition: service_started
  knowledge-sync:
    user: "10003:10010"
    group_add: ["10010"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ones-mcp
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    command:
    - python
    - -m
    - app.cli.knowledge_sync_worker
    environment:
      DATABASE_DSN: *platform-dsn
      APP_CONFIG_MASTER_KEY_FILE: /run/secrets/app_config_master_key
      APP_ENV: ${APP_ENV:-local}
      ONES_MCP_PROVIDER_ALLOWED_HOSTS: ${ONES_MCP_PROVIDER_ALLOWED_HOSTS:-host.docker.internal}
      ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL: ${ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL:-true}
      KNOWLEDGE_SYNC_ENABLED: 'true'
      KNOWLEDGE_STATE_DIR: /state
      CODE_CHECKOUT_ENABLED: ${CODE_CHECKOUT_ENABLED:-false}
      CODE_CHECKOUT_REGISTRY_FILE: /etc/code-svn/checkout.json
      CODE_SVN_AUTH_ROOT: /run/code-svn-auth
      CODE_CHECKOUT_ROOT: /var/lib/code-svn/checkout
      PRINCIPAL_JWKS_FILE: /run/secrets/principal_jwks
    secrets:
    - app_config_master_key
    - principal_jwks
    volumes:
    - knowledge-qdrant:/qdrant/storage:ro
    - knowledge-operation-state:/state
    - type: bind
      source: ${CODE_SVN_LOCAL_STATE_ROOT:-${KNOWLEDGE_DEPLOY_ROOT:-.}/.local/code-svn/state}/configuration
      target: /etc/code-svn
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${CODE_SVN_LOCAL_STATE_ROOT:-${KNOWLEDGE_DEPLOY_ROOT:-.}/.local/code-svn/state}/client
      target: /run/code-svn-auth
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${CODE_SVN_CHECKOUT_HOST_ROOT:-${KNOWLEDGE_DEPLOY_ROOT:-.}/.local/code-svn/checkout}
      target: /var/lib/code-svn/checkout
      bind:
        create_host_path: false
    networks:
    - knowledge-managed
    - provider-egress
    extra_hosts:
    - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777,uid=10003,gid=10003
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    stop_grace_period: 240s
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - app.cli.knowledge_ops
      - health
      - --role
      - sync
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: enterprise-agent/knowledge-sync:local
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      knowledge-embedding:
        condition: service_healthy
      knowledge-qdrant:
        condition: service_started
  knowledge-check:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ones-mcp
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    command:
    - schema
    environment:
      DATABASE_DSN: *platform-dsn
      APP_ENV: ${APP_ENV:-local}
      ONES_MCP_PROVIDER_ALLOWED_HOSTS: ${ONES_MCP_PROVIDER_ALLOWED_HOSTS:-host.docker.internal}
      ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL: ${ONES_MCP_PROVIDER_ALLOW_INSECURE_LOCAL:-true}
      KNOWLEDGE_SYNC_ENABLED: 'true'
      KNOWLEDGE_STATE_DIR: /state
    networks:
    - knowledge-managed
    extra_hosts:
    - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777,uid=10003,gid=10003
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    stop_grace_period: 240s
    restart: 'no'
    image: enterprise-agent/knowledge-sync:local
    profiles:
    - maintenance
    entrypoint:
    - python
    - -m
    - app.cli.knowledge_preflight
  knowledge-ops:
    profiles:
    - maintenance
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrator
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    environment:
      DATABASE_DSN: *platform-dsn
      APP_CONFIG_MASTER_KEY_FILE: ''
      APP_ENV: local
    entrypoint: []
    networks:
    - knowledge-managed
    command:
    - python
    - -m
    - app.cli.index_knowledge
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 1g
  knowledge-ops-controller:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: knowledge-ops-controller
      args:
        BUILD_SOURCE_REVISION: ${BUILD_SOURCE_REVISION:-local-dev}
        BUILD_ID: ${BUILD_ID:-local-dev}
        BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
    command:
    - python
    - -m
    - app.cli.knowledge_ops_controller
    restart: unless-stopped
    environment:
      DATABASE_DSN: *platform-dsn
      KNOWLEDGE_DEPLOY_ROOT: /deployment
      KNOWLEDGE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
      KNOWLEDGE_STATE_DIR: /state
      HOME: /root
      DOCKER_CONFIG: /tmp/docker-config
      PYTHONUNBUFFERED: '1'
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - type: bind
      source: ${KNOWLEDGE_DEPLOY_ROOT:-.}
      target: /deployment
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${APP_CONFIG_MASTER_KEY_FILE:-${HOME}/.config/enterprise-agent/app-config-master-key}
      target: /deployment-secrets/app-config-master-key
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PRINCIPAL_JWKS_FILE:-${HOME}/.config/enterprise-agent/principal-jwks.json}
      target: /deployment-secrets/principal-jwks.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${KNOWLEDGE_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/knowledge-bootstrap-token}
      target: /deployment-secrets/knowledge-bootstrap-token
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${CODE_SVN_CHECKOUT_HOST_ROOT:-${KNOWLEDGE_DEPLOY_ROOT:-.}/.local/code-svn/checkout}
      target: /deployment-code/checkout
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${CODE_SVN_LOCAL_STATE_ROOT:-${KNOWLEDGE_DEPLOY_ROOT:-.}/.local/code-svn/state}
      target: /deployment-code/state
      read_only: true
      bind:
        create_host_path: false
    - knowledge-operation-state:/state
    entrypoint:
    - /usr/local/bin/knowledge-ops-entrypoint
    networks:
    - knowledge-managed
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    - /root:size=16m,mode=0700
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    security_opt:
    - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    stop_grace_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - app.cli.knowledge_ops
      - health
      - --role
      - controller
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

secrets:
  code_runtime_bootstrap_token:
    file: ${CODE_RUNTIME_BOOTSTRAP_TOKEN_HOST_FILE:-${HOME}/.config/enterprise-agent/code-runtime-bootstrap-token}
  knowledge_bootstrap_token:
    file: ${KNOWLEDGE_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/knowledge-bootstrap-token}
  app_config_master_key:
    file: ${APP_CONFIG_MASTER_KEY_FILE:-${HOME}/.config/enterprise-agent/app-config-master-key}
  dingtalk_runtime_auth_token:
    environment: DINGTALK_RUNTIME_AUTH_TOKEN
  runtime_grant_private_key:
    file: ${RUNTIME_GRANT_PRIVATE_KEY_FILE:-${HOME}/.config/enterprise-agent/runtime-grant-private.pem}
  runtime_grant_public_key:
    file: ${RUNTIME_GRANT_PUBLIC_KEY_FILE:-${HOME}/.config/enterprise-agent/runtime-grant-public.pem}
  principal_jwt_private_key:
    file: ${PRINCIPAL_JWT_PRIVATE_KEY_FILE:-${HOME}/.config/enterprise-agent/principal-jwt-private.pem}
  principal_jwks:
    file: ${PRINCIPAL_JWKS_FILE:-${HOME}/.config/enterprise-agent/principal-jwks.json}
  file_worker_bootstrap_token:
    file: ${FILE_WORKER_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/file-worker-bootstrap-token}
  file_processing_worker_bootstrap_token:
    file: ${FILE_PROCESSING_WORKER_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/file-processing-worker-bootstrap-token}
  delivery_worker_bootstrap_token:
    file: ${DELIVERY_WORKER_BOOTSTRAP_TOKEN_FILE:-${HOME}/.config/enterprise-agent/delivery-worker-bootstrap-token}
  docling_api_key:
    file: ${DOCLING_SERVE_API_KEY_FILE:-${HOME}/.config/enterprise-agent/docling-api-key}
  file_storage_bootstrap_access_key:
    environment: MINIO_ROOT_USER
  file_storage_bootstrap_secret_key:
    environment: MINIO_ROOT_PASSWORD
  model_probe_auth_token:
    file: ${MODEL_PROBE_AUTH_TOKEN_FILE:-${HOME}/.config/enterprise-agent/model-probe-auth-token}

volumes:
  knowledge-models:
    external: true
    name: ${KNOWLEDGE_MODEL_VOLUME:-${COMPOSE_PROJECT_NAME}_knowledge-models}
  knowledge-reranker-models:
    external: true
    name: ${KNOWLEDGE_RERANKER_VOLUME:-${COMPOSE_PROJECT_NAME}_knowledge-reranker-models}
  knowledge-qdrant:
    external: true
    name: ${KNOWLEDGE_QDRANT_VOLUME:-${COMPOSE_PROJECT_NAME}_knowledge-qdrant}
  knowledge-operation-state:
    external: true
    name: ${KNOWLEDGE_STATE_VOLUME:-${COMPOSE_PROJECT_NAME}_knowledge_ops_state}
  postgres18-data:
    name: enterprise_agent_postgres18_data
    external: ${POSTGRES18_VOLUME_EXTERNAL:-false}
  rabbitmq4-data:
    name: enterprise_agent_rabbitmq4_data
  minio-data:
    name: enterprise_agent_minio_data

networks:
  knowledge-managed:
    internal: true
    name: ${KNOWLEDGE_CONTENT_NETWORK:-${COMPOSE_PROJECT_NAME}_knowledge_managed}
  agent-runtime-control:
    internal: true
  document-processing:
    internal: true
  provider-egress: {}
