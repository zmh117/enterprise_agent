    environment:
      <<: *worker-env
    secrets:
      - app_config_master_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      python-agent-runtime:
        condition: service_healthy
      typescript-agent-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import time; from pathlib import Path; p=Path('/tmp/channel-dispatch-worker.heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 15s
      timeout: 5s
