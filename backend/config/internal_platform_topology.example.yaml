  # 新腾 / XT MySQL（无车间分层）
  xt:
    display_name: 先泰
    aliases: [XT, MES51]
    bases:
      mes51:
        display_name: MES51
        aliases: [MES51]
        engine: mysql
        database:
          host_ref: secret://platform/xt_mes51_db_host
          port: 3306
          database: MES51
          user_ref: secret://platform/xt_mes51_db_user
          password_ref: secret://platform/xt_mes51_db_password

  # 蒙牛 / MKK SQL Server（无车间分层）
  mmk:
    display_name: 迈克康
    aliases: [MKK]
    bases:
      main:
        display_name: MKKUTF8
        aliases: [MKK, 主库]
        engine: sqlserver
        database:
          host_ref: secret://platform/mmk_main_db_host
          port: 1433
          database: MKKUTF8
          schema: dbo
          user_ref: secret://platform/mmk_main_db_user
          password_ref: secret://platform/mmk_main_db_password

  # Agent 本地测试数据：MySQL / SQL Server × 独立 Redis（无车间分层）
  agent_test:
    display_name: Agent 本地测试数据
    aliases: [agent-test, 本地测试数据]
    bases:
      mysql:
        display_name: MySQL 测试基地
        aliases: [mysql-test]
        engine: mysql
        database:
          host_ref: secret://platform/agent_test_mysql_db_host
          port: 3306
          database: agent_test
          user_ref: secret://platform/agent_test_mysql_db_user
          password_ref: secret://platform/agent_test_mysql_db_password
        redis:
          mode: standalone
          host_ref: secret://platform/agent_test_mysql_redis_host
          port: 6379
          user_ref: secret://platform/agent_test_mysql_redis_user
          password_ref: secret://platform/agent_test_mysql_redis_password
        loki:
          # 与 .env 中 LOKI_BASE_URL / LOKI_TENANT_ID 对齐；查询窗口等限制仍用全局 LOKI_MAX_*
          base_url_ref: secret://platform/agent_test_loki_base_url
          tenant: tenant1

      sqlserver:
        display_name: SQL Server 测试基地
        aliases: [sqlserver-test, mssql-test]
        engine: sqlserver
        database:
          host_ref: secret://platform/agent_test_sqlserver_db_host
          port: 1433
          database: agent_test
          schema: dbo
          user_ref: secret://platform/agent_test_sqlserver_db_user
          password_ref: secret://platform/agent_test_sqlserver_db_password
        redis:
          mode: standalone
          host_ref: secret://platform/agent_test_sqlserver_redis_host
          port: 6379
          user_ref: secret://platform/agent_test_sqlserver_redis_user
          password_ref: secret://platform/agent_test_sqlserver_redis_password
        loki:
          base_url_ref: secret://platform/agent_test_loki_base_url
          tenant: tenant1
