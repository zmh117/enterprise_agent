# Opt in to original-Job readonly code analysis after configuring its dedicated credential.
# Base Compose shares the checkout; no pre-extraction Agent or artifact volume exists.
services:
  api-server:
    environment:
      CODE_RUNTIME_BOOTSTRAP_TOKEN_FILE: /run/secrets/code_runtime_bootstrap_token
    secrets:
      - code_runtime_bootstrap_token
  python-agent-runtime-a:
    environment:
      SERVICE_PRINCIPAL_ENABLED: "true"
      CODE_RUNTIME_BOOTSTRAP_TOKEN_FILE: /run/secrets/code_runtime_bootstrap_token
    secrets:
      - code_runtime_bootstrap_token
  python-agent-runtime-b:
    environment:
      SERVICE_PRINCIPAL_ENABLED: "true"
      CODE_RUNTIME_BOOTSTRAP_TOKEN_FILE: /run/secrets/code_runtime_bootstrap_token
    secrets:
      - code_runtime_bootstrap_token

secrets:
  code_runtime_bootstrap_token:
    file: ${CODE_RUNTIME_BOOTSTRAP_TOKEN_HOST_FILE:?configure a distinct code Runtime bootstrap credential file}
