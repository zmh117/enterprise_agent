# ONES Mock 配置（仅本地联调，勿填真实账号/Token）

server:
  port: 19121

team:
  uuid: MOCK-ONES-TEAM-001
  name: Mock ONES Team

additional_teams:
  - uuid: MOCK-ONES-TEAM-002
    name: Mock ONES Secondary Team

project:
  uuid: MOCK-ONES-PROJECT-001
  name: Mock Manufacturing Project
  scope_uuid: MOCK-ONES-PROJECT-SCOPE-001
  scope_name_pinyin: mock-manufacturing-project

project_roles:
  - uuid: MOCK-ONES-ROLE-MEMBERS
    name: 项目成员
    member_uuids:
      - MOCK-ONES-USER-001
      - MOCK-ONES-USER-002
  - uuid: MOCK-ONES-ROLE-TESTERS
    name: Testers
    member_uuids:
      - MOCK-ONES-USER-002

# 登录该邮箱时返回故意破坏的合同，供适配器负向测试
invalid_response_email: invalid.response@example.test

control_passwords:
  subject_changed: ones-mock-subject-changed-not-a-secret
  team_missing: ones-mock-team-missing-not-a-secret

users:
  - email: mock.user@example.test
    password: ones-mock-password-not-a-secret
    uuid: MOCK-ONES-USER-001
    name: Mock ONES User
    token: MOCK-ONES-TOKEN-NOT-A-SECRET
  - email: mock.owner@example.test
    password: ones-mock-owner-password-not-a-secret
    uuid: MOCK-ONES-USER-002
    name: Mock ONES Owner
    token: MOCK-ONES-TOKEN-OWNER-NOT-A-SECRET

issue_types:
  demand:
    uuid: WE3uoYoq
    scope_uuid: MOCK-ISSUE-SCOPE-DEMAND
    name: 需求
    name_pinyin: xu1qiu2
    detail_type: 1
    icon: 3
  task:
    uuid: Rbk6XNBr
    scope_uuid: MOCK-ISSUE-SCOPE-TASK
    name: 任务
    name_pinyin: ren4wu4
    detail_type: 2
    icon: 1
  defect:
    uuid: B4TV9bu5
    scope_uuid: MOCK-ISSUE-SCOPE-DEFECT
    name: 缺陷
    name_pinyin: que1xian4
    detail_type: 3
    icon: 2

priorities:
  normal:
    uuid: MOCK-PRIORITY-NORMAL
    value: 普通
    color: "#2e7d32"
    bg_color: "#e8f5e9"
    position: 2

statuses:
  todo:
    uuid: MOCK-STATUS-TODO
    name: 待处理
    category: to_do
  in_progress:
    uuid: MOCK-STATUS-IN-PROGRESS
    name: 处理中
    category: in_progress
  done:
    uuid: MOCK-STATUS-DONE
    name: 已完成
    category: done

tasks:
  - number: 900101
    name: "Mock requirement: add production order traceability"
    issue_type: demand
    owner_uuid: MOCK-ONES-USER-001
    status: todo
    priority: normal
    custom_options:
      MOCK-CUSTOM-FIELD-SEVERITY: MOCK-CUSTOM-OPTION-MEDIUM
  - number: 900102
    name: "Mock task: verify production order synchronization"
    issue_type: task
    owner_uuid: MOCK-ONES-USER-002
    status: done
    priority: normal
    custom_options:
      MOCK-CUSTOM-FIELD-SEVERITY: MOCK-CUSTOM-OPTION-LOW
  - number: 900103
    name: "Mock defect: order status is not refreshed"
    issue_type: defect
    owner_uuid: MOCK-ONES-USER-001
    status: todo
    priority: normal
    custom_options:
      MOCK-CUSTOM-FIELD-SEVERITY: MOCK-CUSTOM-OPTION-HIGH
