name: enterprise-agent-ones-mock

services:
  ones-mock:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ONES_MOCK_CONFIG: /app/mock.yaml
    volumes:
      # 挂载配置，改 mock.yaml 后重启容器即可，无需重建镜像
      - ./mock.yaml:/app/mock.yaml:ro
    ports:
      - "127.0.0.1:${ONES_MOCK_PORT:-19121}:19121"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19121/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
