schema: spec-driven

context: |
  语言：中文（简体）。所有提案、需求说明、设计、任务、验收记录及沟通均使用简体中文。
  为兼容 OpenSpec 解析和校验，保留模板的结构标题与 Requirement、Scenario、
  SHALL、MUST、GIVEN、WHEN、THEN、AND 等语法标记；标题中的业务名称和正文使用中文。
  代码标识符、命令、路径、API 名称保持原样；变更目录使用英文 kebab-case。

  项目：MES 浏览器问题证据采集器，Chrome Manifest V3 扩展。
  技术栈：TypeScript、原生 HTML/CSS、rrweb、Chrome Debugger/CDP、IndexedDB、fflate、esbuild。
  Node.js 22.12.0 及以上；依赖由 package-lock.json 精确锁定。
  开发依据：MES_Browser_Evidence_Collector_Development_Spec.md。
  当前能力与验收边界：README.md、docs/acceptance.md。
  内部协议和问题包说明：docs/protocol.md、docs/agent-consumption.md。
  实现之前核对相关代码和验收记录，不把计划、模拟数据或未验证能力写成已完成事实。

  项目推进过程中，若遇到必要的大改，不需要做旧数据兼容，可以直接删除旧数据。
  不要默认最小改动，默认选择稳健方案。
  禁止过度设计，不要设计难以维护的规格。

  严格遵守显式采集范围、停止边界、持久化前脱敏和证据可追溯要求。
  扩展默认本地保存，不自动上传；采集缺口必须明确记录。
  常规检查使用 npm run check；浏览器行为变更按需运行 npm run test:browser。
  浏览器测试仅使用独立测试配置，结束时只清理本任务创建的浏览器和辅助进程。

rules:
  proposal:
    - 用中文说明具体问题、预期行为、范围和影响；引用相关开发规格与已有验收缺口。
  specs:
    - 需求和场景正文使用中文，并保留 OpenSpec 要求的结构与规范关键字。
    - 描述可观察、可验证的行为；明确异常和采集缺口，不承诺尚未验证的平台能力。
  design:
    - 选择稳健且易维护的方案，只记录必要的决策、取舍和风险，避免过度抽象。
  tasks:
    - 使用中文任务描述和可勾选清单；将实现与相关验证列清楚，未完成的验证保持未勾选。
