<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>模拟 MES · 配方维护</title><meta name="frontend-build" content="fixture-frontend-1"><script>fetch('/api/first?id='+encodeURIComponent(new URLSearchParams(location.search).get('id')||'root'));</script><style>body{font:15px/1.7 system-ui;margin:32px;background:#f4f7f3;color:#243a30;max-width:1080px}h1{font-size:26px}section{background:white;border:1px solid #d8e0d5;border-radius:12px;padding:20px;margin:18px 0}label{display:inline-block;margin:8px}input{padding:8px;border:1px solid #c0cfc0;border-radius:5px;width:140px}button,a{display:inline-block;margin:5px;padding:8px 12px;border:1px solid #abc0a9;border-radius:5px;color:#29452f;background:#f6faf2;font:inherit;cursor:pointer}iframe{width:45%;height:130px;border:1px solid #ccc}#result{color:#a04a2e}dialog{border:1px solid #bec8b9;border-radius:12px}code{font-size:12px}</style></head>
<body data-module="recipe-maintenance"><h1>配方维护 <small>本地模拟 MES</small></h1><p>仅用于插件验收。当前服务端配方版本为 2，页面旧版本为 1。</p>
<section><form id="recipe" name="recipeForm"><label>配方编号<input name="recipeId" value="RC-DEMO-01"></label><label>版本<input name="version" value="1"></label><label>精度<input name="precision" value="2"></label><label>数量<input name="quantity" value="12.50"></label><label>密码<input type="password" name="password" value="PASSWORD_SECRET_765"></label><label>认证令牌<input name="accessToken" value="INPUT_SECRET_662"></label><button id="save" type="submit">保存配方</button></form><div data-sensitive>DOM_PRIVATE_SECRET_721</div><p data-evidence>token=DOM_TOKEN_SECRET_227</p><p id="result" role="alert" aria-live="polite"></p><button id="program">程序修改精度</button><button id="toast">短暂提示</button><button id="dialog-open">打开弹框</button><button id="route">SPA 路由</button></section>
<section><h2>派生与生命周期</h2><a id="child" href="/?id=child" target="_blank">普通子标签</a><a id="noopener" href="/?id=noopener" target="_blank" rel="noopener">noopener</a><a id="noreferrer" href="/?id=noreferrer" target="_blank" rel="noreferrer">noreferrer</a><button id="window-open">window.open</button><button id="new-window">新窗口子页</button><button id="named">复用命名窗口</button><button id="fast-close">打开子页并关闭父页</button></section>
<section><h2>网络与错误</h2><button id="slow">未完成请求</button><button id="http-error">HTTP 500</button><button id="network-error">网络失败</button><button id="empty">空正文</button><button id="secret">令牌脱敏</button><button id="large">超大正文</button><button id="redirect">重定向</button><button id="exception">JS 异常</button><button id="console">Console 错误</button><button id="stream">SSE / WebSocket</button><button id="worker">专属 Worker</button><button id="poll">开始轮询</button></section>
<section><h2>iframe</h2><button id="frames">添加同源 / 跨源 iframe</button><div id="frame-area"></div></section>
<dialog id="dialog"><p>确认配方状态</p><input name="batchId" value="BATCH-DEMO-03"><button id="dialog-close">关闭</button></dialog>
<script>
const $=id=>document.getElementById(id);
$('recipe').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;const data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer AUTH_SECRET_593','traceparent':'00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01'},body:JSON.stringify(data)});const x=await r.json();$('result').textContent=x.message;}finally{$('save').disabled=false}};
$('program').onclick=()=>{document.querySelector('[name=precision]').value='3';document.querySelector('[name=quantity]').value='13.125'};
$('toast').onclick=()=>{const n=document.createElement('div');n.setAttribute('role','alert');n.textContent='短暂校验提示：数量精度不匹配';document.body.append(n);setTimeout(()=>n.remove(),120)};
$('dialog-open').onclick=()=>$('dialog').showModal();$('dialog-close').onclick=()=>$('dialog').close();
$('route').onclick=()=>{history.pushState({},'','/recipe/edit?id=RC-DEMO-01&token=URL_SECRET_923#detail');$('result').textContent='已切换配方编辑路由'};
$('window-open').onclick=()=>window.open('/?id=window-open','_blank');
$('new-window').onclick=()=>window.open('/?id=new-window','_blank','width=760,height=680');
$('named').onclick=()=>window.open('/?id=named','mes-existing-named');
$('fast-close').onclick=()=>{window.open('/?id=fast-child','_blank');window.close()};
for(const [id,path]of Object.entries({slow:'slow','http-error':'error','network-error':'network-fail',empty:'empty',secret:'token?token=QUERY_SECRET_482',large:'large',redirect:'redirect'}))$(id).onclick=()=>fetch('/api/'+path).then(r=>r.text()).catch(()=>{});
$('exception').onclick=()=>setTimeout(()=>{throw new Error('模拟组件渲染失败 token=ERROR_SECRET_229')},0);
$('console').onclick=()=>console.error('模拟保存错误 token=CONSOLE_SECRET_917',{password:'CONSOLE_OBJECT_SECRET_812',recipeId:'RC-DEMO-01'});
$('stream').onclick=()=>{window.demoEventSource=new EventSource('/api/events');window.demoSocket=new WebSocket('ws://'+location.host+'/api/socket')};
$('worker').onclick=()=>{window.demoWorker=new Worker('/worker.js');demoWorker.postMessage('start')};
$('poll').onclick=()=>{window.demoPoll=setInterval(()=>fetch('/api/token').then(r=>r.json()).catch(()=>{}),150)};
$('frames').onclick=()=>{$('frame-area').innerHTML='<iframe title="同源" src="/frame?id=same"></iframe><iframe title="跨源" src="http://localhost:__CROSS_PORT__/frame?id=cross"></iframe>'};
</script></body></html>
