name: CI

on:
  pull_request:
  push:
    branches: [mcp_new, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - run: .venv/bin/pytest -q backend/tests/test_schema_migration_runtime.py backend/tests/test_schema_fact_source_manifest.py backend/tests/test_initial_admin_bootstrap.py
      - run: .venv/bin/python scripts/check_markdown_links.py
      - run: .venv/bin/pytest backend/tests

  agent-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contracts
      - run: npm run preflight:static

  dingtalk-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dingtalk-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dingtalk-runtime/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  runtime-images:
    runs-on: ubuntu-latest
    needs: [backend, agent-runtime, dingtalk-runtime]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build typescript-agent-runtime python-agent-runtime dingtalk-runtime

  admin-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
